name: Release

# Run by hand: Actions → Release → Run workflow, with the version to publish.
# Needs the NPM_TOKEN secret. See "Releasing" in CONTRIBUTING.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.1.0 (must match every package.json and a dated CHANGELOG entry)'
        required: true

permissions:
  contents: write # the tag and the GitHub release
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nostro
          POSTGRES_PASSWORD: nostro
          POSTGRES_DB: nostro
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nostro"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      VERSION: ${{ inputs.version }}
      NOSTRO_TEST_DATABASE_URL: postgres://nostro:nostro@localhost:5432/nostro
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: The version matches every package and a dated changelog entry
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a version: $VERSION"; exit 1; }
          for p in core store-sqlite store-postgres server cli; do
            v=$(node -p "require('./packages/$p/package.json').version")
            [ "$v" = "$VERSION" ] || { echo "packages/$p is $v, not $VERSION"; exit 1; }
          done
          grep -Eq "^## $VERSION \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$" CHANGELOG.md \
            || { echo "CHANGELOG.md needs a heading '## $VERSION (YYYY-MM-DD)'"; exit 1; }
          ! git ls-remote --exit-code --tags origin "v$VERSION" || { echo "tag v$VERSION already exists"; exit 1; }

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - run: pnpm test
      - run: node scripts/check-packages.mjs

      - name: Publish to npm, with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          mkdir -p dist-packages
          # Dependencies first; a package already at this version is skipped, so a failed run can be re-run.
          for p in core store-sqlite store-postgres server cli; do
            name=$(node -p "require('./packages/$p/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then echo "$name@$VERSION is already published"; continue; fi
            tarball=$(cd "packages/$p" && pnpm pack --pack-destination ../../dist-packages | tail -1)
            npm publish "$tarball" --provenance --access public
          done

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          awk -v v="$VERSION" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md
